# ~anton/.config/son-of-anton/repos.toml  (owner: the runner user, mode 600)
# Copy this file and replace the placeholders. Real ids belong ONLY in your copy.
# Only github.com is supported; any other host is rejected when the file is loaded.

[github]
app_id = 123456                  # your GitHub App id (not secret; the private key is)
bot_name = "my-anton-app[bot]"   # the app's bot user, used as git author
bot_id = 123456789               # numeric id of that bot user (GET /users/<bot_name>)

[daemon]
max_parallel = 2     # hard cap is 4
daily_limit = 30     # code-change jobs per rolling 24h (the real limit is your Claude subscription)
poll_seconds = 120   # GitHub label poller
bridge_port = 8765          # MCP endpoint for a chat agent, 127.0.0.1 only; needs ~/.config/son-of-anton/bridge-token
bridge_daily_limit = 30     # code-change jobs each chat client may start per 24h
bridge_write_limit = 100    # GitHub writes (issues, comments) per chat client and 24h
bridge_ask_limit = 100      # read-only questions per chat client and 24h

[defaults]
model = "claude-opus-5-5"
max_turns = 30
timeout_minutes = 30
allow_tools = [
  "Read", "Edit", "Write", "Glob", "Grep",
  "Bash(npm run check:*)", "Bash(npm run lint:*)", "Bash(npm run build:*)",
  "Bash(npm run format:*)", "Bash(ls:*)", "Bash(cat:*)", "Bash(grep:*)",
  "Bash(npm install:*)", "Bash(npm uninstall:*)", "Bash(npm update:*)",  # dependencies; scripts never run (see runner)
  "WebSearch", "WebFetch",                                              # web research; delete to turn it off
]
deny_tools = [
  "Bash(git:*)", "Bash(gh:*)", "Bash(curl:*)", "Bash(wget:*)", "Bash(ssh:*)",
  "Bash(npm run deploy:*)", "Bash(npm publish:*)", "Bash(sudo:*)",
  "Bash(rm -rf:*)",
]

[repos."your-name/your-site"]
installation_id = 12345678       # the app installation on this repo
base = "main"
install = "npm ci --ignore-scripts --no-audit --no-fund"   # no postinstall scripts
protected_paths = ["gh-pages.js"]   # the lockfile is NOT protected: adding a dependency changes it
allowed_authors = ["your-github-login"]   # ONLY issues by these logins, labelled by these logins, start jobs
trigger_label = "anton"                   # state labels anton:queued / :running / :pr / :failed are managed

[[repos."your-name/your-site".checks]]
name = "build"
cmd = "npm run build"
kind = "gate"                    # must pass

[[repos."your-name/your-site".checks]]
name = "check"
cmd = "npm run check"
kind = "regression"              # must not get worse than before the job
metric = 'svelte-check found (\d+) errors?'

[[repos."your-name/your-site".checks]]
name = "lint"
cmd = "npm run lint"
kind = "regression"
metric = 'Code style issues found in (\d+) files?'
metric_lines = '^\[warn\] (?!Code style)'   # prettier says "the above file" for one file: count the [warn] lines

# Son of Anton can work on itself. The security core only ever comes back as a PATCH for you to apply
# (protected_paths), a merge changes nothing on the Pi until you update it, and the runner refuses any
# change that contains a stored secret or the shape of a token or key. No npm here, so no `install`.
[repos."your-name/son-of-anton"]
installation_id = 12345678
base = "main"
allow_tools = ["Read", "Edit", "Write", "Glob", "Grep", "Bash(python3 -m unittest:*)",
               "Bash(ls:*)", "Bash(cat:*)", "Bash(grep:*)", "WebSearch", "WebFetch"]
protected_paths = ["anton/sandbox.py", "anton/config.py", "anton/gitops.py", "anton/ghapp.py",
                   "anton/runner.py", "anton/selftest.py", "anton/tripwire.py"]
allowed_authors = ["your-github-login"]
trigger_label = "anton"

[[repos."your-name/son-of-anton".checks]]
name = "tests"
cmd = "PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests"
kind = "gate"
