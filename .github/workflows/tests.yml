name: Tests

# Runs the unit tests on every pull request, on main and on release tags (v*). Read-only, no secrets.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions pinned by commit SHA (checkout v4, setup-python v5)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: sudo apt-get install -y --no-install-recommends bubblewrap
      # the update adapter's tests need the library version selfupdate.toml allows (an installation bundles it)
      - name: Fetch agent-tool-selfupdate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          d=$(mktemp -d)
          curl -fsSL https://github.com/ChristianNorbertBraun/agent-tool-selfupdate/archive/refs/tags/v1.0.0.tar.gz | tar xz -C "$d" --strip-components=1
          PYTHONPATH="$d" python3 -m agent_tool_selfupdate fetch --publisher ChristianNorbertBraun --into .
      - run: python3 -m unittest discover -s tests
      # an installation runs these tests in a sandbox whose home is /home/sandbox: they must pass there too
      - run: HOME=/home/sandbox python3 -m unittest discover -s tests
